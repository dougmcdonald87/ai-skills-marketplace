<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill &mdash; AI Agent Skills Marketplace</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #111; line-height: 1.5; }
.container { max-width: 720px; margin: 0 auto; padding: 24px; }
header { margin-bottom: 32px; }
h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
p.sub { color: #555; font-size: 14px; }
.skill-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
.skill-card h3 { font-size: 18px; margin-bottom: 4px; }
.skill-card p.desc { font-size: 14px; color: #444; margin-bottom: 12px; }
.skill-card .meta { font-size: 12px; color: #777; margin-bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
.skill-card .meta .verified { color: #0a7d33; font-weight: 600; }
.skill-card .price { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
.paypal-btn { display: inline-block; background: #0070ba; color: #fff; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 14px; }
.paypal-btn:hover { background: #005ea5; }
.free-btn { display: inline-block; background: #e8e8e8; color: #111; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 14px; }
.free-btn:hover { background: #d8d8d8; }
.back { display: inline-block; margin-top: 20px; color: #0070ba; text-decoration: none; font-size: 14px; }
.back:hover { text-decoration: underline; }
footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #777; }
</style>
</head>
<body>
<div class="container">
<header>
<h1 id="skill-name">&mdash;</h1>
<p class="sub" id="skill-platform">Platform-agnostic AI agent skill. PayPal only.</p>
</header>

<div class="skill-card" id="skill-card" hidden>
<p class="desc" id="skill-desc"></p>
<div class="meta"><span id="skill-category"></span><span id="skill-verified" class="verified" hidden>Verified</span></div>
<div class="price" id="skill-price"></div>
<a id="skill-action" class="free-btn" href="#" target="_blank" rel="noopener">Install from GitHub</a>
</div>

<p id="skill-missing" hidden>Skill not found. <a href="index.html">Back to the marketplace</a>.</p>

<a href="index.html" class="back">&larr; Back to marketplace</a>

<footer>
<p>AI Agent Skills Marketplace &mdash; Platform-agnostic. Works with every AI agent. PayPal payments only.</p>
</footer>
</div>
<script>
function requestedId() {
  var id = new URLSearchParams(window.location.search).get('id');
  return id ? decodeURIComponent(id) : null;
}

function priceLabel(skill) {
  if (skill.free || !skill.price) return 'Free';
  return '$' + skill.price + ' one-time';
}

function paypalReady(data) {
  var base = data.paypalBase || '';
  if (base.indexOf('yourname') !== -1) return false;
  return /^https:\/\/paypal\.me\/[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(base);
}

function showSkill(data, skill) {
  document.title = skill.name + ' — AI Agent Skills Marketplace';
  document.getElementById('skill-name').textContent = skill.name;
  document.getElementById('skill-platform').textContent = skill.platform;
  document.getElementById('skill-desc').textContent = skill.desc;
  document.getElementById('skill-category').textContent = skill.category;
  document.getElementById('skill-verified').hidden = !skill.verified;
  document.getElementById('skill-price').textContent = priceLabel(skill);

  var btn = document.getElementById('skill-action');
  if (skill.free && skill.github) {
    btn.className = 'free-btn';
    btn.href = skill.github;
    btn.textContent = 'Install from GitHub';
  } else if (!paypalReady(data)) {
    btn.className = 'free-btn';
    btn.href = '#';
    btn.setAttribute('aria-disabled', 'true');
    btn.textContent = 'Payments opening soon';
  } else {
    btn.className = 'paypal-btn';
    btn.href = (data.paypalBase || '') + '/' + skill.price;
    btn.textContent = 'Buy via PayPal';
  }
  document.getElementById('skill-card').hidden = false;
}

function showMissing() {
  document.title = 'Skill not found — AI Agent Skills Marketplace';
  document.getElementById('skill-name').textContent = 'Skill not found';
  document.getElementById('skill-missing').hidden = false;
}

fetch('skills.json')
  .then(function (response) {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  })
  .then(function (data) {
    var id = requestedId();
    var match = (data.skills || []).filter(function (s) { return s.id === id; })[0];
    if (match) showSkill(data, match); else showMissing();
  })
  .catch(function (err) {
    showMissing();
    console.error(err);
  });
</script>
</body>
</html>
